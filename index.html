<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stella & Benedikt</title>
  <meta name="description" content="Links zu Stella Scheld und Benedikt Scheld" />
  <!-- Open Graph / SEO -->
  <meta property="og:title" content="Stella & Benedikt" />
  <meta property="og:description" content="Links zu Stella Scheld und Benedikt Scheld" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <style>
    :root{
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --blue: #1e90ff;
      --yellow: #ffd000;
      --shadow: 0 6px 20px rgba(0,0,0,0.08);
      --shadow-pressed: 0 10px 24px rgba(0,0,0,0.12);
      --radius: 18px;
    }

    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
    }

    img{ max-width: 100%; height: auto; display: block; }

    .wrap{ width: min(880px, 92vw); }

    .grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      justify-content: center;
      gap: 18px;
    }

    @media (max-width: 720px){
      .grid{ grid-template-columns: 1fr; }
      .card{ width: 50vw; margin-inline: auto; }
    }

    .card{
      position: relative;
      aspect-ratio: 1 / 1;
      width: clamp(180px, 28vw, 260px);
      border-radius: var(--radius);
      border: 2px solid transparent;
      display: grid;
      place-items: center;
      text-decoration: none;
      color: inherit;
      background: #fff;
      box-shadow: var(--shadow);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      will-change: transform;
      overflow: visible;
    }

    .card:hover{ box-shadow: var(--shadow-pressed); }
    .card.clicked{ transform: scale(0.985); }

    .inner{
      display: grid;
      place-items: center;
      gap: 10px;
      padding-top: 10%;
    }

    .avatar{
      width: 58%;
      aspect-ratio: 1 / 1;
      border-radius: 999px;
      object-fit: cover;
      border: 2px solid rgba(0,0,0,0.08);
      box-shadow: 0 6px 18px rgba(0,0,0,0.16);
    }

    .avatar.float{
      margin-top: -12%;
      outline: 8px solid var(--bg);
    }

    .label{
      font-size: clamp(18px, 3.2vw, 36px);
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .stella{ border-color: color-mix(in oklab, var(--blue) 65%, transparent); }
    .benedikt{ border-color: color-mix(in oklab, var(--yellow) 65%, transparent); }

    @media (prefers-reduced-motion: no-preference){
      .card:hover{ transform: translateY(-2px); }
      .card.clicked{ transform: scale(0.985) translateY(0); }
    }

    .initials{
      width: 58%;
      aspect-ratio: 1 / 1;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-weight: 700;
      background: #f3f3f3;
      color: var(--muted);
      border: 2px solid rgba(0,0,0,0.08);
      box-shadow: 0 6px 18px rgba(0,0,0,0.16);
      margin-top: -12%;
      outline: 8px solid var(--bg);
    }
  </style>
</head>
<body>
  <main class="wrap" aria-label="Links zu unseren LinkedIn-Profilen">
    <section class="grid">
      <a class="card stella" href="https://www.linkedin.com/in/stella-scheld/" onclick="openLinkedIn('stella-scheld'); return false;" target="_blank" rel="noopener" data-initials="S" aria-label="Öffnet Stellas LinkedIn-Profil">
        <div class="inner">
          <img class="avatar float" src="assets/stella.jpg" alt="Profilbild von Stella" />
          <div class="label">Stella</div>
        </div>
      </a>

      <a class="card benedikt" href="https://www.linkedin.com/in/scheld/" onclick="openLinkedIn('scheld'); return false;" target="_blank" rel="noopener" data-initials="B" aria-label="Öffnet Benedikts LinkedIn-Profil">
        <div class="inner">
          <img class="avatar float" src="assets/benedikt.jpg" alt="Profilbild von Benedikt" />
          <div class="label">Benedikt</div>
        </div>
      </a>
    </section>
  </main>

  <script>
    function openLinkedIn(username) {
      const appLink = `linkedin://in/${username}`;
      const webLink = `https://www.linkedin.com/in/${username}/`;
      window.location = appLink;
      setTimeout(() => {
        window.open(webLink, '_blank', 'noopener');
      }, 800);
    }

    function setupInteractiveCard(card){
      card.addEventListener('click', function(e){
        card.classList.add('clicked');
      });

      const img = card.querySelector('.avatar');
      if(img){
        img.addEventListener('error', () => {
          const init = document.createElement('div');
          init.className = 'initials';
          init.textContent = (card.dataset.initials || '?').slice(0,1);
          img.replaceWith(init);
        }, { once: true });
      }
    }

    document.querySelectorAll('.card').forEach(setupInteractiveCard);
  </script>
</body>
</html>
